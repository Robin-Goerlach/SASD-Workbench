name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SASD-Workbench.slnx

      - name: Build
        run: dotnet build SASD-Workbench.slnx --configuration Release --no-restore

      # xUnit v3 test projects are standalone executables. Running the focused layers separately keeps
      # failures attributable: domain/application rules first, then real SQLite/file-system integration,
      # host-only startup/configuration behavior, and finally the broad production-composition workflow.
      - name: Run domain unit tests
        run: dotnet run --project tests/SASD.Workbench.Domain.Tests/SASD.Workbench.Domain.Tests.csproj --configuration Release --no-build

      - name: Run application unit tests
        run: dotnet run --project tests/SASD.Workbench.Application.Tests/SASD.Workbench.Application.Tests.csproj --configuration Release --no-build

      - name: Run infrastructure integration tests
        run: dotnet run --project tests/SASD.Workbench.Infrastructure.Tests/SASD.Workbench.Infrastructure.Tests.csproj --configuration Release --no-build

      - name: Run WinForms host tests
        run: dotnet run --project tests/SASD.Workbench.WinForms.Tests/SASD.Workbench.WinForms.Tests.csproj --configuration Release --no-build

      - name: Run V1 core smoke tests
        run: dotnet run --project tests/SASD.Workbench.SmokeTests/SASD.Workbench.SmokeTests.csproj --configuration Release --no-build
